name: Build Full

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TLAMATINI_AI_BACKEND: local
  TLAMATINI_SKIP_RUNTIME_VERIFY: "1"
  TLAMATINI_GEMMA3_URL: https://huggingface.co/gaianet/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-Q4_K_M.gguf?download=true
  CLIENT_DEPS: pyinstaller pillow requests pmtiles tkinterdnd2 cryptography numpy opencv-python PyMuPDF pytesseract

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: TLAMATINI-Linux
            build_command: sh scripts/build_full_release_linux.sh
            final_files: |
              dist/TLAMATINI-full-linux-x86_64.tar.gz
              dist/tlamatini-5.2.2-amd64.deb
              dist/SHA256SUMS-linux.txt
              dist/SHA256SUMS-linux.json
              dist/release_metadata-linux.json
          - os: windows-latest
            platform: windows
            artifact_name: TLAMATINI-Windows
            build_command: powershell -ExecutionPolicy Bypass -File scripts/build_full_release_windows.ps1
            final_files: |
              dist/TLAMATINI-Windows-Instalador-Full.exe
              dist/TLAMATINI-full-windows-x86_64.zip
              dist/SHA256SUMS-windows.txt
              dist/SHA256SUMS-windows.json
              dist/release_metadata-windows.json
          - os: macos-latest
            platform: macos
            artifact_name: TLAMATINI-macOS
            build_command: sh scripts/build_full_release_macos.sh
            final_files: |
              dist/TLAMATINI-full-macos.zip
              dist/TLAMATINI-full-macos.dmg
              dist/SHA256SUMS-macos.txt
              dist/SHA256SUMS-macos.json
              dist/release_metadata-macos.json

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Create venv and install dependencies on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install $CLIENT_DEPS

      - name: Create venv and install dependencies on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install $env:CLIENT_DEPS.Split(" ")

      - name: Download runtime and Gemma on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source .venv/bin/activate
          python scripts/local_ai_tool.py download_models

      - name: Download runtime and Gemma on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\.venv\Scripts\python scripts/local_ai_tool.py download_models

      - name: Build Full release
        run: ${{ matrix.build_command }}

      - name: Build Linux DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sh scripts/package_linux_deb.sh

      - name: Install Windows installer tooling
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows\TLAMATINI_full.iss"

      - name: Verify release bundle on Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/verify_release_bundle.py dist/tlamatini_full
          python3 scripts/local_ai_tool.py doctor_full_release

      - name: Verify release bundle on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python scripts/verify_release_bundle.py dist/tlamatini_full
          python scripts/local_ai_tool.py doctor_full_release

      - name: Refresh Linux checksums after DEB
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/refresh_release_checksums.py linux
          sha256sum -c dist/SHA256SUMS-linux.txt

      - name: Refresh Windows checksums after installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          python scripts\refresh_release_checksums.py windows

      - name: Refresh macOS checksums
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 scripts/refresh_release_checksums.py macos

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.final_files }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tag release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.final_files }}
