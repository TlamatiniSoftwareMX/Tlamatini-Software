name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TLAMATINI_AI_BACKEND: local
  TLAMATINI_SKIP_RUNTIME_VERIFY: "1"
  TLAMATINI_GEMMA3_URL: https://huggingface.co/bartowski/google_gemma-3-4b-it-GGUF/resolve/main/google_gemma-3-4b-it-Q4_K_M.gguf?download=true
  CLIENT_DEPS: pyinstaller pillow requests pmtiles tkinterdnd2 cryptography numpy opencv-python PyMuPDF pytesseract

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create environment
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install $env:CLIENT_DEPS.Split(" ")

      - name: Download embedded AI
        shell: powershell
        run: .\.venv\Scripts\python scripts/local_ai_tool.py download_models

      - name: Build portable package
        shell: powershell
        run: .\.venv\Scripts\python scripts/local_ai_tool.py build_full_release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows\TLAMATINI_full.iss"'

      - name: Verify package
        shell: powershell
        run: |
          .\.venv\Scripts\python scripts/verify_release_bundle.py dist/tlamatini_full
          .\.venv\Scripts\python scripts/local_ai_tool.py doctor_full_release
          .\.venv\Scripts\python scripts/refresh_release_checksums.py windows

      - name: Split installer for GitHub
        shell: powershell
        run: |
          $sourcePath = "dist\TLAMATINI-Windows-Instalador-Full.exe"
          $releaseDir = "dist\windows-release"
          $chunkSize = 59MB
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          $source = [System.IO.File]::OpenRead($sourcePath)
          try {
            $count = [int][Math]::Ceiling($source.Length / $chunkSize)
            $buffer = New-Object byte[] (1MB)
            for ($index = 1; $index -le $count; $index++) {
              $name = "tlamatini-5.2.4-windows-installer.chunk-{0:D3}-of-{1:D3}" -f $index, $count
              $destination = [System.IO.File]::Create((Join-Path $releaseDir $name))
              try {
                $remaining = [Math]::Min($chunkSize, $source.Length - $source.Position)
                while ($remaining -gt 0) {
                  $read = $source.Read($buffer, 0, [Math]::Min($buffer.Length, $remaining))
                  if ($read -le 0) { break }
                  $destination.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              }
              finally {
                $destination.Dispose()
              }
            }
          }
          finally {
            $source.Dispose()
          }
          $installerHash = (Get-FileHash -Algorithm SHA256 $sourcePath).Hash.ToLowerInvariant()
          "$installerHash  TLAMATINI-Windows-Instalador-Full.exe" | Set-Content -Encoding ascii (Join-Path $releaseDir "SHA256-WINDOWS-INSTALADOR.txt")
          Get-ChildItem -File (Join-Path $releaseDir "*.chunk-*") | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii (Join-Path $releaseDir "SHA256-WINDOWS-PARTES.txt")
          Copy-Item scripts\INSTALAR-TLAMATINI-WINDOWS.ps1,scripts\INSTALAR-TLAMATINI-WINDOWS.cmd $releaseDir

      - name: Upload Windows installer to release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem -File dist\windows-release | Sort-Object Name | ForEach-Object { $_.FullName })
          gh release upload v5.2.4 $files --clobber --repo $env:GITHUB_REPOSITORY
