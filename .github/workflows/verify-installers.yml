name: Verify installation commands
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows PowerShell installer without installing applications
        shell: powershell
        run: .\tests\verify_edition_installer.ps1
      - name: Verify all three selections without downloading payloads
        shell: powershell
        run: |
          foreach ($edition in @('sin-ia', 'ia-4gb', 'ia-8gb')) {
            & .\scripts\INSTALAR-TLAMATINI-EDICIONES.ps1 -Edicion $edition -Catalogo .\installer\ediciones.json -Verificar
            if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify published PowerShell commands without downloading payloads
        shell: powershell
        run: |
          $published = Join-Path $env:TEMP 'TLAMATINI-instalar.ps1'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/TlamatiniSoftwareMX/Tlamatini-Software/releases/download/ediciones-2026-11-13/INSTALAR-TLAMATINI-EDICIONES.ps1' -OutFile $published
          $actual = [IO.File]::ReadAllText($published).Replace("`r`n", "`n")
          $source = [IO.File]::ReadAllText((Resolve-Path .\scripts\INSTALAR-TLAMATINI-EDICIONES.ps1)).Replace("`r`n", "`n")
          if ($actual -cne $source) { throw 'Published script differs from tested source' }
          foreach ($edition in @('sin-ia', 'ia-4gb', 'ia-8gb')) {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $published -Edicion $edition -Verificar
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
